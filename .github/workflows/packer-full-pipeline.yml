# .github/workflows/packer-full-pipeline.yml
#
# Orchestrates the full three-tier pipeline in sequence:
#   base  →  middleware  →  app
#
# Triggered manually (workflow_dispatch) so you can run the entire chain
# end-to-end without waiting for a push to matching paths.
#
# Tiers chain via HCP Packer: each downstream build resolves its source AMI
# from the prior tier's registry bucket on channel_name = "latest" (not via
# workflow outputs / source_ami handoff).
#
# AWS secrets must allow ec2:DescribeImages (and other Packer EC2 actions)
# with no session-policy deny — Packer always calls DescribeImages to
# validate the source AMI.

name: "Packer — Full Pipeline (base → middleware → app)"

on:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Tier 1 — Base images
  # ------------------------------------------------------------------
  base:
    name: "Tier 1 — Base"
    uses: ./.github/workflows/packer-base.yml
    secrets: inherit

  # ------------------------------------------------------------------
  # Tier 2 — Middleware images (depends on base completing)
  # ------------------------------------------------------------------
  middleware:
    name: "Tier 2 — Middleware"
    needs: base
    uses: ./.github/workflows/packer-middleware.yml
    secrets: inherit

  # ------------------------------------------------------------------
  # Tier 3 — App images (depends on middleware completing)
  # ------------------------------------------------------------------
  app:
    name: "Tier 3 — App"
    needs: middleware
    uses: ./.github/workflows/packer-app.yml
    secrets: inherit
