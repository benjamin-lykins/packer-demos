# .github/workflows/packer-base.yml
#
# Builds all base OS AMIs. Matrix is loaded from .github/matrix.yml.
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_SESSION_TOKEN        (optional — for STS assumed-role credentials)
#
# Required repository variables:
#   AWS_REGION
#   AWS_VPC_ID
#   AWS_SUBNET_ID
#   INSTANCE_TYPE

name: "Packer — Base Images"

on:
  push:
    branches: [main]
    paths:
      - "base/**"
      - "common.pkrvars.hcl"
      - ".github/matrices/base.yml"
      - ".github/workflows/packer-base.yml"
  pull_request:
    branches: [main]
    paths:
      - "base/**"
      - "common.pkrvars.hcl"
      - ".github/matrices/base.yml"
      - ".github/workflows/packer-base.yml"
  workflow_dispatch:
    inputs:
      distro:
        description: "Limit to one distro (leave blank for all)"
        required: false
        default: ""
      version:
        description: "Limit to one version label (leave blank for all)"
        required: false
        default: ""
  workflow_call:
    outputs:
      ami_id:
        description: "Last-built base AMI ID"
        value: ${{ jobs.build.outputs.ami_id }}

jobs:
  # ------------------------------------------------------------------
  # Load the base matrix from .github/matrix.yml
  # ------------------------------------------------------------------
  load-matrix:
    name: "Load matrix"
    uses: ./.github/workflows/matrix-output.yml

  # ------------------------------------------------------------------
  # Validate all templates on every push / PR (no AWS creds needed)
  # ------------------------------------------------------------------
  validate:
    name: "validate / ${{ matrix.distro }} ${{ matrix.version }}"
    runs-on: ubuntu-latest
    needs: load-matrix
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.base) }}

    defaults:
      run:
        working-directory: base/${{ matrix.distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer init
        run: packer init ${{ matrix.distro }}.pkr.hcl

      - name: Packer validate
        # Validate using stub values — no real AWS creds required
        env:
          PKR_VAR_aws_region: "us-east-1"
          PKR_VAR_vpc_id: "vpc-00000000"
          PKR_VAR_subnet_id: "subnet-00000000"
        run: |
          packer validate \
            -var-file=../../common.pkrvars.hcl \
            -var-file=${{ matrix.vars_file }} \
            ${{ matrix.distro }}.pkr.hcl

  # ------------------------------------------------------------------
  # Build — runs on push to main, workflow_dispatch, or workflow_call
  # ------------------------------------------------------------------
  build:
    name: "build / ${{ matrix.distro }} ${{ matrix.version }}"
    runs-on: ubuntu-latest
    needs: load-matrix
    if: github.event_name != 'pull_request'
    environment: aws-packer

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.base) }}

    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}

    defaults:
      run:
        working-directory: base/${{ matrix.distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Write common vars file
        working-directory: ${{ github.workspace }}
        run: |
          cat > common.pkrvars.hcl <<EOF
          aws_region    = "${{ vars.AWS_REGION }}"
          vpc_id        = "${{ vars.AWS_VPC_ID }}"
          subnet_id     = "${{ vars.AWS_SUBNET_ID }}"
          instance_type = "${{ vars.INSTANCE_TYPE }}"
          EOF

      - name: Check distro/version filter
        id: filter
        run: |
          DISTRO_INPUT="${{ github.event.inputs.distro }}"
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "$DISTRO_INPUT" ] && [ "$DISTRO_INPUT" != "${{ matrix.distro }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "${{ matrix.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Packer init
        if: steps.filter.outputs.skip != 'true'
        run: packer init ${{ matrix.distro }}.pkr.hcl

      - name: Packer validate
        if: steps.filter.outputs.skip != 'true'
        run: |
          packer validate \
            -var-file=../../common.pkrvars.hcl \
            -var-file=${{ matrix.vars_file }} \
            ${{ matrix.distro }}.pkr.hcl

      - name: Packer build
        id: build
        if: steps.filter.outputs.skip != 'true'
        run: |
          packer build \
            -var-file=../../common.pkrvars.hcl \
            -var-file=${{ matrix.vars_file }} \
            ${{ matrix.distro }}.pkr.hcl | tee /tmp/packer-output.txt

          AMI_ID=$(grep -oP 'ami-[a-f0-9]+' /tmp/packer-output.txt | tail -1)
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          echo "### Base AMI built" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Distro | ${{ matrix.distro }} ${{ matrix.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | ${{ vars.AWS_REGION }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AMI ID | \`${AMI_ID}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Packer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-log-base-${{ matrix.distro }}-${{ matrix.version }}
          path: base/${{ matrix.distro }}/packer.log
          if-no-files-found: ignore
