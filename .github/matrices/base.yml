# .github/matrices/base.yml
# Matrix entries for the base OS image tier.
# Each entry maps to a distro subdirectory under base/ and a pkrvars file.
# vars_file paths are relative to the base/ layer root.

- distro: ubuntu
  version: "24"
  vars_file: ubuntu/ubuntu-24.pkrvars.hcl
- distro: ubuntu
  version: "22"
  vars_file: ubuntu/ubuntu-22.pkrvars.hcl
- distro: rhel
  version: "9"
  vars_file: rhel/rhel-9.pkrvars.hcl
- distro: rhel
  version: "8"
  vars_file: rhel/rhel-8.pkrvars.hcl
- distro: debian
  version: "12"
  vars_file: debian/debian-12.pkrvars.hcl
- distro: debian
  version: "11"
  vars_file: debian/debian-11.pkrvars.hcl
- distro: rocky
  version: "9"
  vars_file: rocky/rocky-9.pkrvars.hcl
- distro: rocky
  version: "8"
  vars_file: rocky/rocky-8.pkrvars.hcl
